<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="css/index.css">
    <script defer src="index.js"></script>
    <style>
        body {
            background-color: rgb(20, 20, 20);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .menu {
            width: 100%;
            height: 50px;
            background-color: rgb(90, 89, 89);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 0;
        } 
        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }
        .menu a:hover{
            background-color: rgb(65, 64, 64);
        }
        .profile-card {
            width: 90%;
            max-width: 600px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(255, 255, 255, 0.2);
            text-align: center;
            background: linear-gradient(135deg, rgb(31, 30, 30), gray);
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 60%;
            border: 2px solid black;
            margin-bottom: 20px;
        }
        h2, p {
            color: white;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <nav class="menu">
        <a href="index.html">Página Principal</a>
    </nav>
    <form action="">
    <p><input type="text" name="buscar" id="usu" value="Introduzca el usuario">
    <input type="submit" id="buscar" value="buscar"></p> 
    <h2 id="respuesta"></h2>
    <div id="perfil" class="profile-card" style="display: none;">
        <img id="avatar"  alt="Avatar" class="avatar" src="img/Imagen pegada.png">
        <h3 id="username">nombre de usuario</h3>
        <p><strong>Nivel:</strong> <span id="nivel">1</span></p>
        <p><strong>Partidas Ganadas:</strong> <span id="ganadas">0</span></p>
        <p><strong>Partidas Perdidas:</strong> <span id="perdidas">0</span></p>
    </div>
    <script>
        let busqueda = document.getElementById("buscar");
        busqueda.addEventListener("click",function(event){
            event.preventDefault();
            let h2 = document.getElementById("respuesta");
           if(!buscarUsuario(usu.value)){
                h2.textContent = "El usuario que buscas no existe";
                h2.style.color = "red";
           }else{
                let perfil = document.getElementById("perfil");
                perfil.style.display = "block";
                h2.textContent = "Usuario encontrado";
                h2.style.color = "white";
           }
        });
        function buscarUsuario(usuario) {
            for (let i = 0; i < usuario.length-1; i++) {
                if (DATOS["usuarios"][i]["username"] == usuario) {
                    console.log("llego")
                    usuarios(DATOS["usuarios"][i], false);
                    return true;
                } 
            }
            console.log("fallo")
            return false;
        }
    </script>
</form>
</body>
</html>
