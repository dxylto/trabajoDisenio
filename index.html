<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PONG</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <h4>trabajo Marcos, Jaime y Daylto</h4>
    <h1 class="titulo">PONG</h1>
    
    <div class="contenedor"> 
        <div class="menu">
            <p id="nombre">NOMBRE</p>
            <button id="accesibilidad" class="btn" data-bs-toggle="modal" data-bs-target="#accessibilityModal">
                ACCESIBILIDAD
            </button>
          <a href="login.html"> <button id="session" class="btn">INICIAR SESIÓN</button></a>
           <a href="perfil.html"><button id="perfil" class="btn">PERFIL</button></a>
            <button id="ranking" class="btn">RANKINGS</button>
        </div>
        
        <div class="tablero">
            <!--Este div contendrá el juego de pong, solo habrá un pong de manera local-->
            <canvas id="pong" width="800" height="700"></canvas>
          </div>
        
        <div class="jugar">
            <button id="startGame" class="btn">JUGAR</button>
            <button id="linea" class="btn">EN LÍNEA</button>
            <button id="ia" class="btn">IA</button>
           <a href="buscar.html"> <button id="buscar" class="btn">BUSCAR</button></a>
        </div>
    </div>
    <div class="modal fade" id="accessibilityModal" tabindex="-1" aria-labelledby="accessibilityModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="accessibilityModalLabel">Opciones de Accesibilidad</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center">
                    <button class="btn btn-outline-primary mb-2" onclick="aumentarTexto()">Aumentar Texto</button>
                    <button class="btn btn-outline-secondary mb-2" onclick="disminuirTexto()">Disminuir Texto</button>
                    <button class="btn btn-outline-dark mb-2" onclick="modoAltoContraste()">Modo Alto Contraste</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/game.js"></script>
    <script src="js/accessibility.js"></script>
</body>
</html>
