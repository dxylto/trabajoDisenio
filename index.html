<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PONG</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <h4>trabajo Marcos, Jaime y Daylto</h4>
    <h1 class="titulo">PONG</h1>
    
    <div class="contenedor"> 
        <div class="menu">
            <p id="nombre">NOMBRE</p>
            <button id="accesibilidad" class="btn" data-bs-toggle="modal" data-bs-target="#accessibilityModal">
                ACCESIBILIDAD
            </button>
            <button id="session" class="btn">INICIAR SESIÓN</button>
            <button id="tienda" class="btn">TIENDA</button>
            <button id="ranking" class="btn">RANKINGS</button>
        </div>
        
        <div class="tablero"></div>
        
        <div class="jugar">
            <p class="juega">JUGAR</p>
            <button id="linea" class="btn">EN LÍNEA</button>
            <button id="ia" class="btn">IA</button>
            <button id="amigos" class="btn">AMIGOS</button>
        </div>
    </div>
    <div class="modal fade" id="accessibilityModal" tabindex="-1" aria-labelledby="accessibilityModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="accessibilityModalLabel">Opciones de Accesibilidad</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center">
                    <button class="btn btn-outline-primary mb-2" onclick="aumentarTexto()">Aumentar Texto</button>
                    <button class="btn btn-outline-secondary mb-2" onclick="disminuirTexto()">Disminuir Texto</button>
                    <button class="btn btn-outline-dark mb-2" onclick="modoAltoContraste()">Modo Alto Contraste</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
                let fontSize = 16; 

function aumentarTexto() {
    fontSize += 2;
    document.body.style.fontSize = fontSize + "px";
}

function disminuirTexto() {
    if (fontSize > 10) { 
        fontSize -= 2;
        document.body.style.fontSize = fontSize + "px";
    }
}

function modoAltoContraste() {
    document.body.classList.toggle("alto-contraste");
}
</script>

<!--<label for="exampleColorInput" class="form-label">Color picker</label>
<input type="color" class="form-control form-control-color" id="exampleColorInput" value="#563d7c" title="Choose your color">-->
</body>
</html>
