<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - Pong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="index.js"></script>
    <script defer src="js/accessibility.js"></script>
    <style>
        body {
            background-color: rgb(20, 20, 20);
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .menu {
            width: 100%;
            background-color: rgb(90, 89, 89);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 0;
        } 
        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }
        .menu a:hover{
            background-color: rgb(65, 64, 64);
        }
        .profile-card {
            width: 90%;
            max-width: 600px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(255, 255, 255, 0.2);
            text-align: center;
            background: linear-gradient(135deg, rgb(31, 30, 30), gray);
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 60%;
            border: 2px solid black;
            margin-bottom: 20px;
        }
        h2, p {
            color: white;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.2);
        }
        .btn-custom {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: gray;
        }
        .tablaAmigos{
            margin: 50px;
            text-align: center;
            td{
                padding: 10px;
                width: 500px;
            }
        }
        .alto-contraste {
            background-color: black;
            color: white;
            nav, div{
                background-color: black;
                color: white;
                border: white solid 2px;
            }
        }
        footer{
            margin-top: auto;
        }
        #logo svg{
            transition: transform 0.3s ease;
        }
        #logo:active svg{
            transform: scale(0.8);
        }
        #logo svg{
            transform: scale(1);
        }
    </style>
</head>
<body>
    <nav class="menu">
        <a href="index.html">Página Principal</a>
        <a href="">Jugar</a>
    </nav>
    <p id="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
            <rect width="200" height="60" rx="15" fill="#333"/>
            <text x="50%" y="50%" font-size="28" font-family="Arial, sans-serif" fill="white" text-anchor="middle" alignment-baseline="middle">
                PONG
            </text>
            <circle cx="40" cy="30" r="8" fill="#fff"/>
            <circle cx="160" cy="30" r="8" fill="#fff"/>
        </svg>    
    </p>
    <div class="profile-card">
        <img id="avatar"  alt="Avatar" class="avatar" src="img/Imagen pegada.png">
        <h2 id="username">nombre de usuario</h2>
        <p><strong>Nivel:</strong> <span id="nivel">1</span></p>
        <p><strong>Partidas Ganadas:</strong> <span id="ganadas">0</span></p>
        <p><strong>Partidas Perdidas:</strong> <span id="perdidas">0</span></p>
        <button id="verAmigos" class="btn btn-custom mt-2" onclick="verAmigos()">Amigos</button>
      <a href="buscar.html" style="color: white;"> <button id="busqueda" class="btn btn-custom mt-2">Buscar usuarios</button></a> 
    </div>
    <table id="amigos" class="tablaAmigos"></table>
    <script>
    </script>
</body>
</html>
