<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <script defer src="js/accessibility.js"></script>
    <style>
        .rank{
            padding: 5px;
            text-align: center;
            margin: auto;
            td{
                padding-right: 15px;
                padding-left: 15px;
                padding-top: 4px;
                padding-bottom: 4px;
            }
            
        }
        .menu {
            width: 100%;
            background-color: rgb(90, 89, 89);
            padding: 20px;
            height: 50px;
            margin-bottom: 30px;
            top: 0;
        } 
        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
        }
        .menu a:hover{
            background-color: rgb(65, 64, 64);
        }
    </style>
</head>
<body>
    <nav class="menu">
        <a href="index.html">Página Principal</a>
    </nav>
    <h1>RANKING</h1>
    <table id="rankin" class="rank"></table>
    <script  src="index.js"></script>
<script>
    async function datos(funcion) {
    try {
        let r = await fetch("./datos.json");
        DATOS = await r.json();
        funcion();
    } catch (error) {
        console.log("no existe")
    }
}
    function ordenarPorGanadas() {
    let usuariosOr = DATOS.usuarios.slice(); // Copiar el array para no modificar el original
    usuariosOr.sort((a, b) => b.ganadas - a.ganadas); // Ordenar de mayor a menor por ganadas

    let tabla = document.getElementById("rankin");
    for (let i = 0; i < usuariosOr.length; i++) {
        let tr = document.createElement("tr");
        for (const key in usuariosOr[i]) {
            let element = usuariosOr[i][key];
            if (key != "amigos") {
                let td = document.createElement("td");
                td.textContent = element;
                if (i%2==0) {
                    td.style.backgroundColor = "gray";
                    td.style.border = "gray";
                }
                tr.appendChild(td);
            }
            tabla.appendChild(tr)
        }
    }
}
datos(ordenarPorGanadas);
</script>
</body>
</html>
